app-id: com.aiplatformfree.Console
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: aiplatformfree-console
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: "24.08"
    add-ld-path: "."
    no-autodownload: false
    autodelete: false
modules:
  - name: aiplatformfree-console
    buildsystem: simple
    build-commands:
      - cp -r bundle /app/aiplatformfree-console
      - install -Dm755 run.sh /app/bin/aiplatformfree-console
      - install -Dm644 com.aiplatformfree.Console.desktop /app/share/applications/com.aiplatformfree.Console.desktop
      - install -Dm644 com.aiplatformfree.Console.svg /app/share/icons/hicolor/scalable/apps/com.aiplatformfree.Console.svg
    sources:
      - type: dir
        path: ../electron/dist/linux-unpacked
        dest: bundle
      - type: file
        path: com.aiplatformfree.Console.desktop
      - type: file
        path: com.aiplatformfree.Console.svg
      - type: file
        path: run.sh
