name: Keep SMPF Backend Alive

# Ping the Render backend every 10 minutes to prevent sleep.
# Render free tier sleeps after 15 minutes of inactivity.
# 10-minute interval ensures it NEVER sleeps.

on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 minutes
  workflow_dispatch:          # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sSf https://smpf-backend.onrender.com/health \
            -H "User-Agent: SMPF-KeepAlive-GitHubActions/1.0" \
            --max-time 30 \
            || echo "Ping failed — will retry next cycle"

      - name: Ping analytics endpoint (heavier check)
        run: |
          curl -sSf https://smpf-backend.onrender.com/api/analytics/overview \
            -H "User-Agent: SMPF-KeepAlive-GitHubActions/1.0" \
            --max-time 30 \
            || echo "Analytics ping failed — health check may still work"
